{% extends 'layout/base_layout.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="row g-0">

            <div class="col-md-5">

                <img src="{{ food.food_image.url }}" class="img-fluid rounded-start h-100" style="object-fit:cover;"
                    alt="{{ food.food_name }}">

            </div>

            <div class="col-md-7">

                <div class="card-body p-4">

                    <h1 class="card-title">
                        {{ food.food_name }}
                    </h1>

                    <h3 class="text-success mb-3">
                        ₹{{ food.price }}
                    </h3>

                    <hr>

                    <h5>Description</h5>

                    <p>
                        {{ food.description }}
                    </p>

                    <hr>

                    <h5>Restaurant</h5>
                    <img src="{{ food.restaurant.restaurant_image.url }}" class="img-fluid rounded-start h-100" style="object-fit:cover;"
                        alt="{{ food.food_name }}">
                    <p>
                        <strong>
                            {{ food.restaurant.shop_name }}
                        </strong>
                    </p>

                    <p>
                        {{ food.restaurant.address }}
                    </p>

                    <hr>

                    <form action="{% url 'add_to_cart' %}" method="POST">

                        {% csrf_token %}

                        <input type="hidden" name="food_id" value="{{ food.id }}">

                        <div class="row">

                            <div class="col-md-3">

                                <input type="number" name="quantity" value="1" min="1" class="form-control">

                            </div>

                            <div class="col-md-9">

                                <button type="submit" class="btn btn-warning btn-lg w-100">
                                    Add To Cart
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
