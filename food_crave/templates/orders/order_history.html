<h1>My Orders</h1>

{% for order in orders %}

<div>
    <h3>Order #{{ order.id }}</h3>

    <p>Status: {{ order.status }}</p>

    <p>
       Delivery Charge:
       ₹{{ order.delivery_fee }}
    </p>

    <p>
        Total:
        ₹{{ order.total_price|add:order.delivery_fee }}
    </p>

   

    <p>OTP: {{ order.delivery_otp }}</p>
</div>

{% empty %}

<p>No orders found.</p>

{% endfor %}
